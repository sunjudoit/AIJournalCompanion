<h1>AI Journal Companion Help</h1>

<h2>How to Use</h2>

<p>1. Write your journal.</p>

<p>2. Press ANALYZE.</p>

<p>3. View emotion and advice.</p>

<p>4. Use SORT to sort journals.</p>

<p>5. Use SEARCH to search journals.</p>

<p>6. Use CHART to view emotion statistics.</p>
